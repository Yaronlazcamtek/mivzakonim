name: Update news feeds

# Collects the news and publishes the whole site to GitHub Pages in one go.
# data/feeds.json is built fresh on every run and is NOT committed to the repo,
# so the repo doesn't grow and the Pages "10 builds per hour" limit doesn't apply.

on:
  schedule:
    - cron: "*/10 * * * *"   # backup timer; the main trigger is cron-job.org (workflow_dispatch)
  workflow_dispatch:          # started by cron-job.org, or by hand from the Actions tab
  push:
    branches: [main]          # any change to the site is published right away

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_feeds.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # .well-known/assetlinks.json links the Android app to the site; hidden folders are skipped otherwise
          include-hidden-files: true
      # deploy-pages sometimes asks for the artifact a moment before GitHub's API lists it
      # ("No artifacts named github-pages were found"), so on failure wait and try once more.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
